<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="waLogoTitle">
  <title id="waLogoTitle">WorldArts</title>
  <defs>
    <linearGradient id="waGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C88A"/>
      <stop offset="1" stop-color="#B4884A"/>
    </linearGradient>
    <linearGradient id="waPlum" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7A3B57"/>
      <stop offset="1" stop-color="#3B1F2B"/>
    </linearGradient>
  </defs>

  <!-- coins de cadre de galerie -->
  <path d="M6 26 V10 a4 4 0 0 1 4-4 H26" fill="none" stroke="url(#waGold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M114 26 V10 a4 4 0 0 0 -4-4 H94" fill="none" stroke="url(#waGold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M6 94 V110 a4 4 0 0 0 4 4 H26" fill="none" stroke="url(#waGold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M114 94 V110 a4 4 0 0 1 -4 4 H94" fill="none" stroke="url(#waGold)" stroke-width="4" stroke-linecap="round"/>

  <!-- globe en coups de pinceau -->
  <circle cx="60" cy="60" r="30" fill="url(#waPlum)"/>
  <path d="M30 60 C44 50, 76 50, 90 60" fill="none" stroke="url(#waGold)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 48 C46 42, 74 42, 88 48" fill="none" stroke="url(#waGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 72 C46 78, 74 78, 88 72" fill="none" stroke="url(#waGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="60" cy="60" rx="12" ry="30" fill="none" stroke="url(#waGold)" stroke-width="2" opacity="0.55"/>

  <!-- pointe de pinceau -->
  <path d="M60 30 L66 12 L54 12 Z" fill="url(#waGold)"/>
</svg>
